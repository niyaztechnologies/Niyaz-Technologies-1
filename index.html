        .transform-style-3d { transform-style: preserve-3d; }

        .tilt-card {
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);

        }
        .tilt-card:hover {
            transform: translateY(-15px) rotateX(8deg) rotateY(-4deg);

        @keyframes float3d {
            0% { transform: translateY(0px) rotateX(0deg) translateZ(0px); }

            100% { transform: translateY(0px) rotateX(0deg) translateZ(0px); }
        }
        .animate-3d-float { animation: float3d 10s ease-in-out infinite; }
        
        .glass-3d {
          background: rgba(255, 255, 255, 0.03);
          backdrop-filter: blur(20px);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
